<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b6ef5">
  <title>Mi Agenda</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi Agenda">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pantalla de acceso -->
  <section id="login" class="login" hidden>
    <img src="icon.svg" alt="" width="96" height="96">
    <h1>Mi Agenda</h1>
    <p>Tus pendientes y recordatorios, en todos tus dispositivos.</p>
    <button id="btn-login" class="btn primary">Entrar con Google</button>
  </section>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div id="nav" class="nav">
        <button id="prev" class="icon-btn" aria-label="Mes anterior">&#8249;</button>
        <h2 id="month-title"></h2>
        <button id="next" class="icon-btn" aria-label="Mes siguiente">&#8250;</button>
      </div>
      <div class="actions">
        <button id="today" class="btn">Este mes</button>
        <button id="btn-notif" class="btn" hidden>&#128276; Activar avisos</button>
        <button id="btn-notif-off" class="btn" hidden>Desactivar avisos</button>
        <button id="btn-logout" class="btn">Salir</button>
      </div>
    </header>

    <div id="ios-hint" class="hint" hidden>
      <p><strong>Para recibir avisos en iPhone/iPad:</strong> toca <em>Compartir</em> (cuadro con flecha) &rarr; <em>Agregar a pantalla de inicio</em> y abre la app desde ese ícono.</p>
      <button id="ios-hint-close" class="icon-btn" type="button" aria-label="Cerrar aviso">&times;</button>
    </div>

    <nav class="tabs" aria-label="Vista">
      <button id="tab-month" class="tab" type="button" aria-current="page">Calendario</button>
      <button id="tab-today" class="tab" type="button">Hoy</button>
    </nav>

    <main>
      <div id="view-month">
        <div class="weekdays">
          <span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span>
        </div>
        <div id="grid" class="grid"></div>
      </div>

      <section id="view-today" hidden aria-labelledby="today-title">
        <div class="today-head">
          <div>
            <h2 id="today-title"></h2>
            <p id="today-summary" class="muted"></p>
          </div>
          <button id="today-add" class="btn primary" type="button">+ Agregar</button>
        </div>
        <ul id="today-list" class="list"></ul>
      </section>
    </main>
  </div>

  <!-- Detalle del día -->
  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="sheet-head">
        <h3 id="modal-title"></h3>
        <button id="close" class="icon-btn" aria-label="Cerrar">&times;</button>
      </div>
      <ul id="list" class="list"></ul>
      <form id="form" class="form">
        <input id="f-title" type="text" aria-label="Título del pendiente" placeholder="Nuevo pendiente" maxlength="120" required>
        <label id="f-date-row" hidden>Fecha <input id="f-date" type="date"></label>
        <div class="row">
          <label>Hora <input id="f-time" type="time" value="09:00" required></label>
          <label>Avisar
            <select id="f-remind">
              <option value="0">A la hora</option>
              <option value="5">5 min antes</option>
              <option value="15">15 min antes</option>
              <option value="30">30 min antes</option>
              <option value="60">1 hora antes</option>
              <option value="1440">1 día antes</option>
              <option value="-1">Sin aviso</option>
            </select>
          </label>
        </div>
        <div class="form-actions">
          <button id="f-submit" class="btn primary" type="submit">Agregar</button>
          <button id="f-cancel" class="btn" type="button" hidden>Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
